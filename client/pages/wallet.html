<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>TPL22 | Wallet</title>

        <!-- Font Awesome -->

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

        <script src="../js/app-config.js"></script>

        <script src="../js/auth-guard.js"></script>

        <!-- CSS -->

        <link rel="stylesheet"
            href="../css/common.css">

        <link rel="stylesheet"
            href="../css/wallet.css">

    </head>

    <body>

        <div class="wallet-page">

            <!-- Header -->

            <header class="wallet-header">

                <div class="user-info">

                    <img
                        src="../assets/images/default-avatar.png"
                        id="userAvatar"
                        alt="Avatar">

                    <div>

                        <h2 id="userName">

                            Player Name

                        </h2>

                        <p>

                            UID :
                            <span id="userId">

                                PMS100001

                            </span>

                        </p>

                    </div>

                </div>

                <button
                    id="refreshBalance"
                    class="refresh-btn">

                    <i class="fa-solid fa-rotate"></i>

                </button>

            </header>

            <!-- Balance Card -->

            <section class="balance-card">

                <p>

                    Available Balance

                </p>

                <h1>

                    ৳

                    <span id="walletBalance">

                        0.00

                    </span>

                </h1>

                <small>

                    Last Updated :
                    <span id="lastUpdated">

                        Just Now

                    </span>

                </small>

            </section>

            <!-- Quick Actions -->

            <section class="quick-actions">

                <button id="depositBtn" type="button">

                    <i class="fa-solid fa-circle-plus"></i>

                    Deposit

                </button>

                <button id="withdrawBtn" type="button">

                    <i class="fa-solid fa-money-bill-transfer"></i>

                    Withdraw

                </button>

                <button id="historyBtn" type="button">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    History

                </button>

                <button
                    id="bonusBtn"
                    type="button"
                    aria-label="Bonus coming soon">

                    <i class="fa-solid fa-gift"></i>

                    Bonus

                </button>

            </section>

            <!-- Statistics -->

            <section class="stats">

                <h3>

                    Statistics

                </h3>

                <div class="stats-grid">
                    <!-- Total Deposit -->

                    <div class="stat-card">

                        <i class="fa-solid fa-arrow-down"></i>

                        <h4>Total Deposit</h4>

                        <h2 id="totalDeposit">

                            ৳ 0.00

                        </h2>

                    </div>

                    <!-- Total Withdraw -->

                    <div class="stat-card">

                        <i class="fa-solid fa-arrow-up"></i>

                        <h4>Total Withdraw</h4>

                        <h2 id="totalWithdraw">

                            ৳ 0.00

                        </h2>

                    </div>

                    <!-- Total Winning -->

                    <div class="stat-card">

                        <i class="fa-solid fa-trophy"></i>

                        <h4>Total Winning</h4>

                        <h2 id="totalWinning">

                            ৳ 0.00

                        </h2>

                    </div>

                </div>

            </section>

            <!-- Recent Transactions -->
            <!-- Transaction History -->

            <section
                class="transactions"
                id="transactionHistory">

                <div class="section-header">

                    <h3>
                        Transaction History
                    </h3>

                    <button
                        id="viewAllBtn"
                        type="button"
                        hidden>
                        Load More
                    </button>

                </div>

                <!--
        সব transaction wallet.js
        API থেকে এখানে তৈরি করবে।
        কোনো demo transaction থাকবে না।
    -->

                <div
                    id="transactionList"
                    class="transaction-list"></div>

            </section>

            <!-- Bottom Navigation -->

            <nav
                class="bottom-nav"
                aria-label="Wallet navigation">

                <button
                    class="nav-item"
                    id="walletHomeBtn"
                    type="button">

                    <i class="fa-solid fa-house"></i>

                    <span>Home</span>

                </button>

                <button
                    class="nav-item active"
                    id="walletNavBtn"
                    type="button"
                    aria-current="page">

                    <i class="fa-solid fa-wallet"></i>

                    <span>Wallet</span>

                </button>

                <button
                    class="nav-item"
                    id="walletGamesBtn"
                    type="button">

                    <i class="fa-solid fa-gamepad"></i>

                    <span>Games</span>

                </button>

                <button
                    class="nav-item"
                    id="walletSupportBtn"
                    type="button">

                    <i class="fa-solid fa-headset"></i>

                    <span>Support</span>

                </button>

                <button
                    class="nav-item"
                    id="walletProfileBtn"
                    type="button">

                    <i class="fa-solid fa-user"></i>

                    <span>Profile</span>

                </button>

            </nav>

        </div>

        <!-- Loading -->

        <div
            class="loader-overlay"
            id="loaderOverlay">

            <div class="loader"></div>

        </div>

        <!-- Toast -->

        <div
            id="toast"
            class="toast">

        </div>

        <!-- Wallet JS -->

        <script src="../js/wallet.js"></script>

    </body>

</html>
